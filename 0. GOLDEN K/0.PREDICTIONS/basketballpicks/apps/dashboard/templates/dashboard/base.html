<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}basketballpicks{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 0 1.5rem 3rem; }
    header { display: flex; gap: 1.25rem; align-items: baseline; padding: 1rem 0; border-bottom: 1px solid #8884; }
    header b { font-size: 1.1rem; }
    nav a { margin-right: 1rem; text-decoration: none; }
    nav a:hover { text-decoration: underline; }
    h1 { font-size: 1.3rem; margin: 1.2rem 0 .3rem; }
    .muted { color: #8889; }
    table { border-collapse: collapse; width: 100%; margin: .75rem 0; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: .35rem .6rem; border-bottom: 1px solid #8883; white-space: nowrap; }
    th { font-weight: 600; }
    .tag { padding: .05rem .45rem; border-radius: .5rem; font-size: .8rem; font-weight: 600; }
    .CONFIRM { background: #1a7f37; color: #fff; }
    .KILL { background: #b62324; color: #fff; }
    .HOLD { background: #8883; }
    .pos { color: #1a7f37; }
    .neg { color: #b62324; }
    .banner { background: #f7b32033; border: 1px solid #f7b32066; padding: .6rem .8rem; border-radius: .5rem; margin: 1rem 0; }
    .scroll { overflow-x: auto; }
    code { background: #8882; padding: .05rem .3rem; border-radius: .25rem; }
  </style>
</head>
<body>
  <header>
    <b>🏀 basketballpicks</b>
    <nav>
      <a href="{% url 'dashboard:clv-gate' %}">CLV Gate</a>
      <a href="{% url 'dashboard:edge' %}">Edge Today</a>
      <a href="{% url 'dashboard:predictions' %}">Predictions</a>
    </nav>
    <span class="muted" style="margin-left:auto">paper-only · forward-validated</span>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
